name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The command uses Homebrew internals. A weekly run finds a Homebrew change that breaks it, even when no commit lands.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOMEBREW_DEVELOPER: "1"
    steps:
      # setup-homebrew fetches this repository as a tap. A private repository needs a token for that fetch.
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - uses: Homebrew/actions/setup-homebrew@6b24903f05b5c95b9a56dae6257b9f6f535a3c48 # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew config
      - run: brew ruby test/style.rb
      - name: Check that the style check fails on an offense
        run: |
          printf "puts   %s\n" "\"canary\"" > lib/canary.rb
          if output=$(brew ruby test/style.rb -- lib/canary.rb 2>&1); then
            echo "$output"
            echo "The style check passed a file with offenses."
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "lib/canary.rb:" || { echo "The style check failed for another reason."; exit 1; }

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_DEVELOPER: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # setup-homebrew fetches this repository as a tap. A private repository needs a token for that fetch.
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - uses: Homebrew/actions/setup-homebrew@6b24903f05b5c95b9a56dae6257b9f6f535a3c48 # main
      # On macOS, checkout hangs in its fetch while the rewrite is active.
      - run: git config --global --remove-section url."https://x-access-token:${{ github.token }}@github.com/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the integration tests
        run: brew ruby test/integration.rb
        env:
          HOMEBREW_SUBSTITUTE_TEST_SANDBOX: "1"
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
          HOMEBREW_LOGS: ${{ runner.temp }}/homebrew-logs
          HOMEBREW_NO_AUTO_UPDATE: "1"
